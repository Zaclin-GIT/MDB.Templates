name: Publish Template Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version override (leave empty to use csproj version)"
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Strip leading 'v' from tag if present
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack -c Release -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push bin/Release/*.nupkg
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/Zaclin-GIT/index.json
          --skip-duplicate

      - name: Push to NuGet.org
        if: vars.PUSH_TO_NUGET == 'true'
        run: >
          dotnet nuget push bin/Release/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
